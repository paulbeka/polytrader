[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polytrader"
version = "0.1.0"
description = "Polymarket research and automation foundations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
sandbox = ["pandas>=2.2", "pyarrow>=15", "matplotlib>=3.8", "ipykernel>=6.29"]
live = ["websockets>=14,<18"]

[project.scripts]
polytrader = "polytrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"polytrader.orderbook" = ["viewer.html"]
"polytrader.bot" = ["config/*.example.toml"]
"polytrader.bot.time_arbitrage" = ["README.md"]
