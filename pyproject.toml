[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polytrader"
version = "0.1.0"
description = "Small tools for fetching public Polymarket data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
polytrader = "polytrader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
