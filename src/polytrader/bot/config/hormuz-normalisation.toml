# Ordered Polymarket references checked on 2026-09-27.
# Run from repo root: python -m polytrader.bot.time_arbitrage --config <this-file> --validate
# Only currently open contracts are included; remove entries as they close.
version = 1

[scanner]
# Relative to this file. Retained from your example; adjust if its location differs.
output_dir = "../../../../data/time_arbitrage/hormuz-normalisation"
depth_mode = "top" # top or full; full consumes only the profitable depth prefix
min_edge_per_pair = "0.001"
min_total_profit = "0.10"
min_shares = "1"
max_shares = "1000"
max_cost_per_opportunity = "500" # both legs, fees, estimated costs and buffer
health_check_seconds = 1
summary_seconds = 60
update_log_seconds = 5

[costs]
fee_mode = "auto"
unknown_fee_policy = "skip"
extra_cost_per_pair = "0" # funding/redemption allocations excluded unless set
fixed_cost_per_opportunity = "0" # once per two-leg batch
execution_buffer_per_pair = "0.001"
refresh_seconds = 300
max_metadata_age_seconds = 900

[[chains]]
id = "hormuz-normalisation"
enabled = true
relation = "yes_implies_next_yes"
# Array order is authoritative; it represents implication, not necessarily time.
# Optional deadline fields are omitted: metadata endDate is not always the rule cutoff.
# Order: earliest to latest. Labels use the question date, not the UTC end date.
# Rules use IMF Portwatch 7-day average transit calls >= 60, with publication/revision clauses.
# Creation dates differ: verify observation-window compatibility before treating a signal as arbitrage.
markets = [
  { ref = "https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-september-30-20260702154339440", label = "September 30, 2026" },
  { ref = "https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-october-31-20260810151043583", label = "October 31, 2026" },
  { ref = "https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-november-30-20260810151158765", label = "November 30, 2026" },
  { ref = "https://polymarket.com/event/strait-of-hormuz-traffic-returns-to-normal-by-december-31", label = "December 31, 2026" },
]
