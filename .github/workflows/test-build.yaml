name: Test and publish
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.14'}
      - run: pip install -r deploy/requirements.lock
      - run: pip install --no-deps -e .
      - run: python -m unittest discover -s tests -q
      - run: for script in deploy/*.sh; do bash -n "$script"; done
      - run: docker compose -f deploy/compose.yaml config --quiet
        env:
          POLYTRADER_IMAGE: ghcr.io/paulbeka/polytrader@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          load: true
          tags: polytrader-ci:test
          build-args: GIT_SHA=${{ github.sha }}
      - name: Smoke test the Linux image without external feeds
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp polytrader-ci:test python -m polytrader.ops collect --root /tmp/research --once
          docker run --rm --network none --read-only --tmpfs /tmp polytrader-ci:test python -m polytrader.ops worker lead_follower --config /app/src/polytrader/bot/config/lead_follower.example.toml --output /tmp/run --offline
          docker run --rm --network none --read-only --tmpfs /tmp polytrader-ci:test python -m polytrader.ops worker time_arbitrage --config /app/src/polytrader/bot/config/example.time_arbitrage.toml --output /tmp/run --offline
  publish:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: ghcr.io/paulbeka/polytrader:${{ github.sha }}
          build-args: GIT_SHA=${{ github.sha }}
      - run: echo "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ghcr.io/paulbeka/polytrader@${{ steps.build.outputs.digest }}
      - name: Write immutable release manifest
        run: python deploy/release_manifest.py
        env:
          RELEASE_IMAGE: ghcr.io/paulbeka/polytrader@${{ steps.build.outputs.digest }}
          RELEASE_COMMIT: ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: polytrader-release
          path: release.json
